<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart pos supermarket system</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    

    <header>
        <h1>🛒Jenga Mart - Smart POS</h1>
        <p>Built with Javascript Functions. No frameworks required</p>
    </header>
<main>
<section class="stats" aria-label="Session statistics">
<div class="stat"><label>Items in Cart</label><strong id="item-count">0</strong></div>
<div class="stat"><label>Completed Sales</label><strong id="sales-count">0</strong></div>
<div class="stat"><label>Session revenue</label><strong id="revenue"></strong></div>
</section>
<section class="layout">
<div class="panel">
<h2>Available Products</h2>
<div class="products" id="products"></div>
</div>
<div class="panel">
<h2>Customer Cart</h2>
<div id="cart-items" aria-live="polite"></div>

<div class="line"><span>Subtotal</span> <strong id="subtotal"></strong></div>
<div class="line"><span>Discount (5% on $10,000)</span><strong id="discount">$0</strong>
<div class="line-total"><span>Total Due</span><span id="total">$0</span></div>
<button class="checkout" id="checkout" onclick="checkout()">Complete Sale and print receipt</button>
</div>
<p class="notes">Practice project</p>
<section class="receipt" id="receipt-section">
    <h2>Latest receipt</h2>
<pre id="receipt"></pre>
<button onclick="window.print()">Print page</button>
</div>
</section>
</section>
</main>
<footer>
    jenga tech institute. functions => state => interface => working system
</footer>
<script src="script.js"></script>
</body>
</html>
